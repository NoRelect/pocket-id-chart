name: Lint

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0

      - name: Lint chart
        run: helm lint .

      - name: Validate rendered templates
        run: helm template pocket-id . > /dev/null
